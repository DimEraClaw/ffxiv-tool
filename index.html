<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FFXIV 潛水艇/飛空艇探索計時器</title>
    <!-- Google Fonts: Noto Sans TC (繁中) & Montserrat (英數) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css?v=4.1">
</head>
<body>
    <div class="app-wrapper">
        <!-- FFXIV Style Main Banner / Title Bar -->
        <header class="main-header">
            <div class="header-title">
                <i class="fa-solid fa-anchor gold-icon"></i>
                <h2>請選擇潛水艇 / 飛空艇</h2>
            </div>
            <div class="header-actions">
                <button class="ff-btn btn-secondary" onclick="toggleSettings()" title="音效設定">
                    <i class="fa-solid fa-gear"></i> 音效設定
                </button>
                <button class="ff-btn btn-primary" onclick="openRoutePlannerModal()" title="智慧航線推薦">
                    <i class="fa-solid fa-compass"></i> 航線推薦
                </button>
                <button class="ff-btn btn-primary" onclick="openAddWorkshopModal()">
                    <i class="fa-solid fa-plus"></i> 新增部隊工坊
                </button>
                <button class="ff-btn btn-secondary" onclick="playTestSound()">
                    <i class="fa-solid fa-volume-high"></i> 測試提示音
                </button>
            </div>
        </header>

        <!-- Collapsible Settings Panel -->
        <div id="settings-panel" class="settings-panel" style="display: none;">
            <div class="card-border-frame">
                <div class="ff-corner ff-corner-tl"></div>
                <div class="ff-corner ff-corner-tr"></div>
                <div class="ff-corner ff-corner-bl"></div>
                <div class="ff-corner ff-corner-br"></div>
            </div>
            <div class="settings-body">
                <label for="custom-audio-url"><i class="fa-solid fa-music gold-icon"></i> 自訂探索結束提示音網址 (MP3/WAV)：</label>
                <input type="text" id="custom-audio-url" placeholder="請輸入音效 URL (留空則使用預設的 FFXIV 水晶合成音效)" class="ff-input" onchange="saveCustomAudioUrl(this.value)">
            </div>
        </div>

        <!-- Grid Container for Workshops (Multi-column) -->
        <main class="workshops-grid" id="workshops-container">
            <!-- Dynamic Workshop Card Elements will be rendered here -->
        </main>
    </div>

    <!-- Modal 1: Add/Edit Workshop -->
    <div id="workshop-modal" class="modal-overlay">
        <div class="ff-dialog">
            <div class="card-border-frame">
                <div class="ff-corner ff-corner-tl"></div>
                <div class="ff-corner ff-corner-tr"></div>
                <div class="ff-corner ff-corner-bl"></div>
                <div class="ff-corner ff-corner-br"></div>
            </div>
            <h3 class="dialog-title" id="workshop-modal-title">新增部隊工坊</h3>
            <div class="dialog-body">
                <div class="form-group">
                    <label for="workshop-name">工坊/部隊名稱：</label>
                    <input type="text" id="workshop-name" placeholder="例如：空想秘錄、材料探索" class="ff-input">
                </div>
            </div>
            <div class="dialog-footer">
                <button class="ff-btn btn-primary" onclick="saveWorkshop()">確認</button>
                <button class="ff-btn btn-secondary" onclick="closeModal('workshop-modal')">取消</button>
            </div>
        </div>
    </div>

    <!-- Modal 2: Edit Submersible Timer -->
    <div id="sub-modal" class="modal-overlay">
        <div class="ff-dialog dialog-large">
            <div class="card-border-frame">
                <div class="ff-corner ff-corner-tl"></div>
                <div class="ff-corner ff-corner-tr"></div>
                <div class="ff-corner ff-corner-bl"></div>
                <div class="ff-corner ff-corner-br"></div>
            </div>
            <h3 class="dialog-title" id="sub-modal-title">潛水艇探索設定</h3>
            <div class="dialog-body">
                <input type="hidden" id="current-workshop-idx">
                <input type="hidden" id="current-sub-idx">
                
                <div class="form-group">
                    <label for="sub-name">潛水艇名稱：</label>
                    <input type="text" id="sub-name" placeholder="例如：潛水艇-1" class="ff-input">
                </div>

                <div class="form-group-row">
                    <div class="form-group col-half">
                        <label for="sub-level">等級 (級)：</label>
                        <input type="number" id="sub-level" placeholder="64" min="1" max="120" class="ff-input">
                    </div>
                    <div class="form-group col-half">
                        <label for="sub-type">類型：</label>
                        <select id="sub-type" class="ff-select">
                            <option value="潜水艇">潛水艇</option>
                            <option value="飞空艇">飛空艇</option>
                        </select>
                    </div>
                </div>

                <!-- Timer Section -->
                <div class="timer-config-box">
                    <label class="section-label">🕒 探索時長設定</label>

                    <!-- Custom inputs -->
                    <div class="custom-time-inputs">
                        <div class="time-input-item">
                            <input type="number" id="input-days" min="0" value="0" class="ff-input time-num">
                            <span>天</span>
                        </div>
                        <div class="time-input-item">
                            <input type="number" id="input-hours" min="0" max="23" value="0" class="ff-input time-num">
                            <span>小時</span>
                        </div>
                        <div class="time-input-item">
                            <input type="number" id="input-mins" min="0" max="59" value="0" class="ff-input time-num">
                            <span>分鐘</span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="dialog-footer">
                <button class="ff-btn btn-primary" onclick="saveSubmersible()">開始探索</button>
                <button class="ff-btn btn-warning" id="btn-standby-sub" onclick="setSubStandby()">設為待命/返航</button>
                <button class="ff-btn btn-danger" id="btn-delete-sub" onclick="deleteSubmersible()">刪除機體</button>
                <button class="ff-btn btn-secondary" onclick="closeModal('sub-modal')">取消</button>
            </div>
        </div>
    </div>

    <!-- Modal 3: Alarm Alert (Looping) -->
    <div id="alarm-modal" class="modal-overlay">
        <div class="ff-dialog">
            <div class="card-border-frame">
                <div class="ff-corner ff-corner-tl"></div>
                <div class="ff-corner ff-corner-tr"></div>
                <div class="ff-corner ff-corner-bl"></div>
                <div class="ff-corner ff-corner-br"></div>
            </div>
            <h3 class="dialog-title" style="color: var(--ff-text-gold);"><i class="fa-solid fa-bell fa-bounce" style="color: var(--ff-text-gold); margin-right: 8px;"></i> 探索結束通知</h3>
            <div class="dialog-body" style="text-align: center; gap: 10px;">
                <p style="font-size: 14px; color: var(--ff-text-normal);">以下探索機體已順利返航：</p>
                <div id="alarm-sub-list" style="background: rgba(0,0,0,0.3); border: 1px solid rgba(140, 115, 85, 0.2); border-radius: 4px; padding: 12px; margin: 10px 0; max-height: 150px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px;">
                    <!-- Dynamically populated list -->
                </div>
            </div>
            <div class="dialog-footer" style="justify-content: center; padding-top: 14px;">
                <button class="ff-btn btn-warning" onclick="dismissAlarm()" style="width: 100%; padding: 12px; font-size: 14px;">
                    <i class="fa-solid fa-volume-xmark"></i> 關閉鬧鐘提示音
                </button>
            </div>
        </div>
    </div>

    <!-- Modal 4: Chart Site Unlock Tracker -->
    <div id="chart-modal" class="modal-overlay">
        <div class="ff-dialog dialog-large">
            <div class="card-border-frame">
                <div class="ff-corner ff-corner-tl"></div>
                <div class="ff-corner ff-corner-tr"></div>
                <div class="ff-corner ff-corner-bl"></div>
                <div class="ff-corner ff-corner-br"></div>
            </div>
            <h3 class="dialog-title" id="chart-modal-title">海圖解鎖進度</h3>
            <div class="dialog-body">
                <input type="hidden" id="chart-modal-ws-idx">
                <input type="hidden" id="chart-modal-chart-key">
                
                <!-- Bulk Actions -->
                <div class="modal-bulk-actions" style="display: flex; gap: 12px; justify-content: flex-end; margin-bottom: 8px;">
                    <button class="ff-btn btn-secondary" onclick="chartBulkAction('all')" style="padding: 6px 12px; font-size: 12px;">全選</button>
                    <button class="ff-btn btn-secondary" onclick="chartBulkAction('clear')" style="padding: 6px 12px; font-size: 12px;">全清</button>
                </div>
                
                <!-- Sites Grid -->
                <div class="sites-grid" id="chart-sites-container">
                    <!-- Site toggle buttons will be generated dynamically -->
                </div>
            </div>
            <div class="dialog-footer" style="justify-content: center; padding-top: 14px;">
                <button class="ff-btn btn-primary" onclick="closeChartModal()" style="width: 100%; padding: 12px; font-size: 14px;">
                    確定 / 關閉
                </button>
            </div>
        </div>
    </div>

    <!-- Modal 5: Submersible Stats Calculator -->
    <div id="stats-modal" class="modal-overlay">
        <div class="ff-dialog dialog-large">
            <div class="card-border-frame">
                <div class="ff-corner ff-corner-tl"></div>
                <div class="ff-corner ff-corner-tr"></div>
                <div class="ff-corner ff-corner-bl"></div>
                <div class="ff-corner ff-corner-br"></div>
            </div>
            <h3 class="dialog-title"><i class="fa-solid fa-calculator gold-icon" style="margin-right: 8px;"></i> 船艦屬性計算器</h3>
            <div class="dialog-body">
                <div class="calc-container">
                    <!-- Left Column: Inputs -->
                    <div class="calc-inputs-column">
                        <div class="form-group">
                            <label for="calc-level"><i class="fa-solid fa-star gold-icon"></i> 潛水艇等級 (Lv. 1～95)：</label>
                            <select id="calc-level" class="ff-select" onchange="onCalcLevelChange()"></select>
                        </div>
                        <div class="form-group">
                            <label for="calc-hull"><i class="fa-solid fa-circle-nodes gold-icon"></i> 船體 (Hull)：</label>
                            <select id="calc-hull" class="ff-select" onchange="calculateSubStats()"></select>
                        </div>
                        <div class="form-group">
                            <label for="calc-stern"><i class="fa-solid fa-circle-nodes gold-icon"></i> 船尾 (Stern)：</label>
                            <select id="calc-stern" class="ff-select" onchange="calculateSubStats()"></select>
                        </div>
                        <div class="form-group">
                            <label for="calc-bow"><i class="fa-solid fa-circle-nodes gold-icon"></i> 船首 (Bow)：</label>
                            <select id="calc-bow" class="ff-select" onchange="calculateSubStats()"></select>
                        </div>
                        <div class="form-group">
                            <label for="calc-bridge"><i class="fa-solid fa-circle-nodes gold-icon"></i> 艦橋 (Bridge)：</label>
                            <select id="calc-bridge" class="ff-select" onchange="calculateSubStats()"></select>
                        </div>
                    </div>

                    <!-- Right Column: Outputs -->
                    <div class="calc-outputs-column">
                        <div class="stats-display-card">
                            <div class="stats-card-title">最終潛艇性能</div>
                            
                            <div class="stat-row">
                                <span class="stat-name">探索性能 <small>Surveillance</small></span>
                                <span class="stat-val" id="stat-val-surveillance">0</span>
                            </div>
                            <div class="stat-row">
                                <span class="stat-name">收集性能 <small>Retrieval</small></span>
                                <span class="stat-val" id="stat-val-retrieval">0</span>
                            </div>
                            <div class="stat-row">
                                <span class="stat-name">巡航速度 <small>Speed</small></span>
                                <span class="stat-val" id="stat-val-speed">0</span>
                            </div>
                            <div class="stat-row">
                                <span class="stat-name">航行距離 <small>Range</small></span>
                                <span class="stat-val" id="stat-val-range">0</span>
                            </div>
                            <div class="stat-row">
                                <span class="stat-name">恩惠 <small>Favor</small></span>
                                <span class="stat-val" id="stat-val-favor">0</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="dialog-footer" style="justify-content: center; padding-top: 14px;">
                <button class="ff-btn btn-secondary" onclick="closeModal('stats-modal')" style="width: 100%; padding: 12px; font-size: 14px;">
                    關閉視窗
                </button>
            </div>
        </div>
    </div>

    <!-- Modal 6: Submersible Route Recommender -->
    <div id="route-modal" class="modal-overlay">
        <div class="ff-dialog dialog-route-planner">
            <div class="card-border-frame">
                <div class="ff-corner ff-corner-tl"></div>
                <div class="ff-corner ff-corner-tr"></div>
                <div class="ff-corner ff-corner-bl"></div>
                <div class="ff-corner ff-corner-br"></div>
            </div>
            <h3 class="dialog-title"><i class="fa-solid fa-compass gold-icon" style="margin-right: 8px;"></i> 智慧航線推薦系統</h3>
            <div class="dialog-body">
                <!-- Route Planner Settings Bar -->
                <div class="route-settings-card">
                    <!-- Row 1: Workshop & Target Filters -->
                    <div class="route-settings-grid">
                        <div class="form-group">
                            <label for="route-ws-select"><i class="fa-solid fa-warehouse gold-icon"></i> 選擇工坊 (解鎖進度)：</label>
                            <select id="route-ws-select" class="ff-select" onchange="runRouteSearch()"></select>
                        </div>
                        <div class="form-group">
                            <label for="route-chart-select"><i class="fa-solid fa-map-location-dot gold-icon"></i> 目標海域：</label>
                            <select id="route-chart-select" class="ff-select" onchange="runRouteSearch()">
                                <option value="drowned_city">溺沒海 (The Drowned City)</option>
                                <option value="jade_sea">灰海 (The Jade Sea)</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="route-objective"><i class="fa-solid fa-bullseye gold-icon"></i> 推薦目標：</label>
                            <select id="route-objective" class="ff-select" onchange="runRouteSearch()">
                                <option value="exp" selected>📈 經驗效率優先 (每分EXP高)</option>
                                <option value="total_exp">⭐ 單趟總經驗最大 (總EXP高)</option>
                                <option value="gil">💰 沉船金飾撈金 (OJ 優先)</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="route-target-time"><i class="fa-solid fa-clock gold-icon"></i> 作息時長限制：</label>
                            <select id="route-target-time" class="ff-select" onchange="runRouteSearch()">
                                <option value="999">不限時長 (效益優先)</option>
                                <option value="24">剛好 24 小時以內 (每日收成)</option>
                                <option value="20">20 小時以內 (快速循環)</option>
                                <option value="48">48 小時以內 (雙日長航)</option>
                            </select>
                        </div>
                    </div>

                    <!-- Row 2: Submersible Level & 4 Parts Configuration (Matching User Spec) -->
                    <div class="route-sub-config-box">
                        <div class="route-sub-config-top">
                            <div class="route-level-input-group">
                                <label for="route-level"><i class="fa-solid fa-star gold-icon"></i> 潛水艇等級：</label>
                                <input type="number" id="route-level" class="ff-input" value="50" min="1" max="95" onchange="onRouteLevelChange()">
                            </div>
                            <div class="route-stats-badges-container" id="route-stats-badges-container">
                                <span class="route-mini-badge">探索性能 <strong id="route-badge-surveillance">0</strong></span>
                                <span class="route-mini-badge">收集性能 <strong id="route-badge-retrieval">0</strong></span>
                                <span class="route-mini-badge">巡航速度 <strong id="route-badge-speed">0</strong></span>
                                <span class="route-mini-badge highlight">航行距離 <strong id="route-badge-range">0</strong></span>
                                <span class="route-mini-badge">恩惠 <strong id="route-badge-favor">0</strong></span>
                            </div>
                        </div>
                        <div class="route-parts-grid">
                            <div class="form-group">
                                <label for="route-hull">船體 (Hull)：</label>
                                <select id="route-hull" class="ff-select" onchange="onRoutePartChange()"></select>
                            </div>
                            <div class="form-group">
                                <label for="route-stern">船尾 (Stern)：</label>
                                <select id="route-stern" class="ff-select" onchange="onRoutePartChange()"></select>
                            </div>
                            <div class="form-group">
                                <label for="route-bow">船首 (Bow)：</label>
                                <select id="route-bow" class="ff-select" onchange="onRoutePartChange()"></select>
                            </div>
                            <div class="form-group">
                                <label for="route-bridge">艦橋 (Bridge)：</label>
                                <select id="route-bridge" class="ff-select" onchange="onRoutePartChange()"></select>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Recommended Results Container -->
                <div class="route-results-wrapper">
                    <div class="route-results-header">
                        <h4><i class="fa-solid fa-list-ol gold-icon"></i> 推薦航線列表 (Top 5)</h4>
                        <span id="route-search-summary" class="route-search-summary">正在分析航線...</span>
                    </div>
                    <div id="route-results-container" class="route-cards-list">
                        <!-- Cards will be injected dynamically -->
                    </div>
                </div>
            </div>
            <div class="dialog-footer" style="justify-content: center; padding-top: 14px;">
                <button class="ff-btn btn-secondary" onclick="closeModal('route-modal')" style="width: 100%; padding: 12px; font-size: 14px;">
                    關閉視窗
                </button>
            </div>
        </div>
    </div>

    <!-- Modal 7: Quick Dispatch to Existing Submersible Modal -->
    <div id="route-dispatch-modal" class="modal-overlay">
        <div class="ff-dialog" style="max-width: 520px;">
            <div class="card-border-frame">
                <div class="ff-corner ff-corner-tl"></div>
                <div class="ff-corner ff-corner-tr"></div>
                <div class="ff-corner ff-corner-bl"></div>
                <div class="ff-corner ff-corner-br"></div>
            </div>
            <h3 class="dialog-title"><i class="fa-solid fa-paper-plane gold-icon" style="margin-right: 8px;"></i> 選擇要套用出航的潛水艇</h3>
            <div class="dialog-body">
                <div id="route-dispatch-info" style="color: var(--ff-text-normal); font-size: 13px; margin-bottom: 14px; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 4px; border: 1px solid rgba(140,115,85,0.3);"></div>
                <div id="route-dispatch-sub-list" style="display: flex; flex-direction: column; gap: 8px;">
                    <!-- Submersibles injected dynamically -->
                </div>
            </div>
            <div class="dialog-footer">
                <button class="ff-btn btn-secondary" onclick="closeModal('route-dispatch-modal')" style="width: 100%;">
                    取消
                </button>
            </div>
        </div>
    </div>

    <!-- Custom Script -->
    <script src="app.js?v=4.1"></script>
</body>
</html>
